name: ewc
# TBD (tune on held-out experiences: configs/experiment/tune.yaml)
ewc_lambda: 1000
# online on EVERY benchmark (one decayed importance matrix + one parameter copy, ~89 MB for
# ResNet-18). mode=separate stores one importance tensor + one parameter copy PER training
# experience (~0.9 GB after 10 ResNet-18 experiences, ~7 GB after 79 CORe50 batches); runs with
# more training experiences than max_separate_experiences and mode=separate are refused at
# build time (ValueError).
mode: online          # online | separate (online requires decay_factor)
decay_factor: 0.9
max_separate_experiences: 20
