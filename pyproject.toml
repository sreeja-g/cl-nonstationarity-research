[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clns"
version = "0.1.0"
description = "Continual learning under nonstationarity: benchmarks, strategies and analysis"
requires-python = ">=3.10,<3.12"
# All pins are "verify on first install" (no Python available when this was written).
# torch/torchvision: install the CUDA 12.1 wheels via requirements.txt (extra index URL).
dependencies = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "avalanche-lib==0.6.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    # avalanche 0.6.0 WandBLogger calls wandb.run._label(repo=...) (private API) -> pin a
    # 0.16/0.17-era release. (verify)
    "wandb==0.17.9",
    "numpy<2",
    "scipy",
    "pandas",
    "dill",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
plots = ["matplotlib"]

[project.scripts]
clns-train = "clns.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests (large data, network or GPU); deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
